<body class="at-home">

<!-- One pane, reused by every micro-app. The router pushes it in from the
     right and lets the home fall back behind it. -->
<div id="homeStub">
  <div class="stubPane">
    <div class="stubBar">
      <button type="button" id="stubBack" aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M15 5 8 12l7 7"/>
        </svg>
      </button>
      <h2 id="stubTitle" tabindex="-1"></h2>
      <!-- The menu trigger. dashboard.ts fills it with the menu mark and the avatar. -->

              aria-haspopup="true" aria-expanded="false" aria-controls="navMenu"></button>
    </div>

<div id="toast" role="status" aria-live="polite"></div>
